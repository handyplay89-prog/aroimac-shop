<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aroimac ARO428 — Power Bank 50000 мАг</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .product {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .product-image {
      text-align: center;
      margin-bottom: 25px;
    }

    .product-image img {
      max-width: 350px;
      width: 100%;
      border-radius: 15px;
    }

    .price {
      margin: 20px 0;
    }

    .old-price {
      color: #999;
      text-decoration: line-through;
      font-size: 20px;
      margin-right: 10px;
    }

    .new-price {
      color: #e53935;
      font-size: 32px;
      font-weight: bold;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 25px 0;
    }

    .feature {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 10px;
    }

    .order-box {
      margin-top: 30px;
      padding: 25px;
      background: #fafafa;
      border-radius: 15px;
    }

    .order-box h2 {
      margin-top: 0;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block;
      background: #dff5e3;
      color: #176b2c;
    }

    .error {
      display: block;
      background: #ffe0e0;
      color: #a00000;
    }

    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }

      .product {
        padding: 20px;
      }

      h1 {
        font-size: 27px;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="product">

    <h1>Aroimac ARO428 — Power Bank 50000 мАг</h1>

    <div class="subtitle">
      Потужна портативна батарея для смартфона, планшета та інших пристроїв
    </div>

    <div class="product-image">
      <div style="
        width:280px;
        height:360px;
        margin:auto;
        background:#111;
        border-radius:35px;
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-size:24px;
        font-weight:bold;
        box-shadow:0 15px 30px rgba(0,0,0,0.25);
      ">
        ARO428<br>50000 mAh
      </div>
    </div>

    <div class="price">
      <span class="old-price">2299 грн</span>
      <span class="new-price">1799 грн</span>
    </div>

    <div class="features">
      <div class="feature">🔋 <b>50000 мАг</b></div>
      <div class="feature">⚡ <b>Швидка зарядка 22.5W</b></div>
      <div class="feature">📱 Для смартфонів та планшетів</div>
      <div class="feature">🚚 Доставка по Україні</div>
    </div>

    <div class="order-box">

      <h2>Замовити зараз</h2>

      <form id="orderForm">

        <input
          type="text"
          id="name"
          placeholder="Ваше ім’я"
          required
        >

        <input
          type="tel"
          id="phone"
          placeholder="Ваш телефон"
          required
        >

        <input
          type="text"
          id="city"
          placeholder="Місто"
          required
        >

        <select id="post" required>
          <option value="">Оберіть пошту</option>
          <option value="Нова Пошта">Нова Пошта</option>
          <option value="Укрпошта">Укрпошта</option>
          <option value="Meest">Meest</option>
        </select>

        <input
          type="text"
          id="branch"
          placeholder="Номер відділення / поштомату"
          required
        >

        <textarea
          id="comment"
          placeholder="Коментар до замовлення"
        ></textarea>

        <button type="submit" id="submitButton">
          Замовити за 1799 грн
        </button>

        <div id="message" class="message"></div>

      </form>

    </div>

  </div>

</div>


<script>

const WORKER_URL =
  "https://raspy-breeze-4f65.handyplay89.workers.dev/api/order";


document.getElementById("orderForm").addEventListener("submit", async function(event) {

  event.preventDefault();

  const button = document.getElementById("submitButton");
  const message = document.getElementById("message");

  button.disabled = true;
  button.textContent = "Відправлення...";

  message.className = "message";
  message.style.display = "none";

  const data = {
    name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    city: document.getElementById("city").value.trim(),
    post: document.getElementById("post").value,
    branch: document.getElementById("branch").value.trim(),
    comment: document.getElementById("comment").value.trim()
  };


  try {

    const response = await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(data)

    });


    const result = await response.text();


    if (response.ok) {

      message.textContent =
        "✅ Замовлення успішно відправлено! Ми зв'яжемося з вами найближчим часом.";

      message.className = "message success";

      document.getElementById("orderForm").reset();

    } else {

      console.error(result);

      message.textContent =
        "❌ Не вдалося відправити замовлення. Спробуйте ще раз.";

      message.className = "message error";

    }

  } catch (error) {

    console.error(error);

    message.textContent =
      "❌ Помилка з'єднання. Перевірте інтернет та спробуйте ще раз.";

    message.className = "message error";

  }


  button.disabled = false;
  button.textContent = "Замовити за 1799 грн";

});

</script>

</body>
</html>
